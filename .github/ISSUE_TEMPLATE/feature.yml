name: 功能建议
description: 提出新功能、改进或文档建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题，而不是直接指定实现方案。
        与「更准确的失败清单或可执行证据」相关的建议优先。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程的哪一部分不够用或容易出错？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以列出可选方案、取舍和对现有行为的影响。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - review 命令
        - verify 命令
        - run 命令（legacy）
        - 模型与配置
        - 文档与测试
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 与项目约束的一致性
      options:
        - label: 该建议不依赖把模型判断描述为正确性证明
          required: true
        - label: 该建议不包含概率分级宣传（旧 run 模式除外）
          required: true
